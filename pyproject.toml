[tool.poetry]
name = "careflow"
version = "0.1.0"
description = "CareFlow Healthcare Management System"
authors = ["ramijashaik001-byte <ramijashaik001@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.100.0"
uvicorn = ">=0.22.0"
sqlalchemy = ">=2.0.0"
pydantic = ">=2.0.0"
pydantic-settings = ">=2.0.0"
python-jose = ">=3.3.0"
passlib = ">=1.7.4"
bcrypt = ">=4.0.1"
pytest = ">=7.0.0"
httpx = ">=0.24.0"
python-multipart = ">=0.0.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
